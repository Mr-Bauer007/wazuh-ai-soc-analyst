name: Security Review Gate

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce security review for sensitive issues
        uses: actions/github-script@v7
        env:
          APPSEC_TEAM_SLUG: ${{ vars.APPSEC_TEAM_SLUG }}
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const body = pullRequest.body || '';
            const issueNumbers = new Set();
            const referencePattern = /(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?|refs?)\s+(?:(?:[^\s/]+)\/[^\s#]+)?#(\d+)/gi;

            for (const match of body.matchAll(referencePattern)) {
              issueNumbers.add(Number(match[1]));
            }

            const events = await github.paginate(
              github.rest.issues.listEventsForTimeline,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                per_page: 100
              }
            );

            for (const event of events) {
              const sourceRepository = event.source?.repository?.full_name;
              if (
                event.event === 'cross-referenced' &&
                sourceRepository === `${context.repo.owner}/${context.repo.repo}` &&
                event.source?.issue?.number
              ) {
                issueNumbers.add(event.source.issue.number);
              }
            }

            let sensitiveIssue;
            for (const issueNumber of issueNumbers) {
              const { data: issue } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              if (issue.labels.some((label) => label.name === 'security-sensitive')) {
                sensitiveIssue = issue;
                break;
              }
            }

            if (!sensitiveIssue) {
              return;
            }

            const threatModelComplete = /- \[x\] Threat model completed \(STRIDE \/ data-flow review\)/i.test(body);
            const mitigationComplete = /- \[x\] Risk mitigation documented or risk acceptance approved/i.test(body);
            const noticeMarker = '<!-- security-review-gate -->';

            if (!threatModelComplete || !mitigationComplete) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'security-review-required'
                });
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'security-review-required',
                  color: 'fbca04',
                  description: 'Pull request security review is incomplete'
                });
              }

              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                labels: ['security-review-required']
              });

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                per_page: 100
              });

              if (!comments.some((comment) => comment.body?.includes(noticeMarker))) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pullRequest.number,
                  body: `${noticeMarker}\nThis pull request resolves a \`security-sensitive\` issue (#${sensitiveIssue.number}). Check both Security Review boxes and add the threat analysis and mitigation details before requesting merge.`
                });
              }

              core.setFailed('Security review checklist is incomplete.');
              return;
            }

            if (!process.env.APPSEC_TEAM_SLUG) {
              core.setFailed('Repository variable APPSEC_TEAM_SLUG is not configured.');
              return;
            }

            await github.rest.pulls.requestReviewers({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullRequest.number,
              team_reviewers: [process.env.APPSEC_TEAM_SLUG]
            });